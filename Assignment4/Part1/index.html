<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
Name: Susan Asalat
File: index.html
Date: 16 July 2026
Description: This page creates a random silly story using JavaScript.
-->
<meta name="viewport" content="width=device-width">
<title>Silly Story Generator</title>
<link href="style.css" rel="stylesheet">
</head>

<body>
  <h1>Silly Story Generator</h1>

  <p class="instructions">
    Enter a name, choose US or UK, and generate a random story.
  </p>

  <div>
    <label for="customname">Enter custom name:</label>
    <input id="customname" type="text">
  </div>

  <div>
    <label for="us">US</label>
    <input id="us" type="radio" name="ukus" value="us" checked>

    <label for="uk">UK</label>
    <input id="uk" type="radio" name="ukus" value="uk">
  </div>

  <div>
    <button class="randomize">Generate random story</button>
  </div>

  <p class="story"></p>
  <p class="footer-note">Created using HTML, CSS, and JavaScript.</p>

  <script src="main.js"></script>
</body>
</html>
